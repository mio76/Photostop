<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Photostop</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="favicon-48x48.png">
  <style>
    
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      color: #1e3c72;
      text-align: center;
    }

    header {
      animation: fadeIn 2s ease-in-out;
    }

    h1 { margin-bottom: 10px; }
    p { 
      font-size: 1.2em; 
      font-weight: bold; 
      margin: 0 auto;       /* центрирование блока */
    }

  .download-btn {  
    display: inline-block;
    color: #fff;
    font-size: 1.4em;
    font-weight: 100;
    padding: 15px 50px;
    margin: 20px 0 10px;
    text-decoration: none;
    border-radius: 15px;
    border: 1px solid #fff;
    transition: 0.5s;
  
  /* фон у стилі Tor Browser */
  background-image: linear-gradient(135deg, #002a7f, #07bafc, #002a7f);
  background-origin: border-box;
  background-clip: padding-box, border-box;
  background-size: 200% 200%;
  animation: gradientShift 6s ease infinite;
  
  box-shadow: 0 6px 15px rgba(0,0,0,0.3);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

@keyframes gradientShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.download-btn:hover {
  transform: scale(1.1);
  box-shadow: 0 10px 25px rgba(0,0,0,0.6);
}

@keyframes gradientShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin: 20px;
    }

    .zoomable {
      width: 100%;
      max-width: 350px;
      height: auto;
      border-radius: 4px;
      box-shadow: 0 10px 10px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.5s ease-in-out;
    }

    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 999;
    }

    footer, .top {
      color: #777;
      padding: 10px 0;
      background: rgba(0,0,0,0.5);
    }

    .logo {
  max-width: 70%;  /* ширина */
  height: auto;  /* висота автоматично підлаштовується */
}

.download-btn .main-text {
  font-size: 1.2em;
  font-weight: bold;
  color: #fff;
}

.download-btn .sub-text {
  font-size: 0.9em;
  color: #fff;
}

.video-item {
  flex: 1 1 calc(20% - 30px); /* три в ряд */
  max-width: 228px;               /* обмеження ширини */
}

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
  body {
    font-size: 0.9em;
  }

  .logo {
  max-width: 80%;  /* ширина */
  height: auto;  /* висота автоматично підлаштовується */
}

  .download-btn {
    font-size: 1em;
    padding: 12px 20px;
    width: 50%;
  }

  .gallery {
    flex-direction: column;
    gap: 15px;
  }

  .zoomable {
    max-width: 100%;
  }
}

@media screen and (orientation: landscape) {
  body {
    background-image: url("background.jpg"); /* твоє фото */
    background-size: cover;       /* розтягнути на весь екран */
    background-position: center;  /* вирівняти по центру */
    background-attachment: fixed; /* паралакс ефект */
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
  }   
}

@media (max-width: 600px) {
  .video-item {
    flex: 1 1 100%;
    max-width: 100%;
  }  
}
.top {
  background-color: rgba(255,255,255,0.4);
}

.parallax-container {
  position: relative;
  overflow: hidden;
}

.parallax-bg {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 120%; /* трохи більше за екран */
  background: url("background.jpg") center/cover no-repeat;
  transform: translateY(0);
  z-index: -1;
}

.page-wrapper {
    max-width: 800px;
    width: 100%;
    background-color: rgba(255,255,255,0.5); /* напівпрозорий блок поверх фото */
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  </style>
</head>
<body>

  <div class="parallax-container">
  <div class="parallax-bg"></div>
  <div class="page-wrapper">
    <div class="top">
    <p style="font-size: 1em; font-weight: 100;">© 2026 Photostop | Розробник: І.М.Овсієнко</p>
    </div>
    <header>
      <h1>
        <img src="icon.png" alt="Mini Photostop" class="logo">
      </h1>

      <p>Проста та легка програма для редагування зображень.<br>Скачай і спробуй прямо зараз!</p>
      <a href="Photostop.zip" class="download-btn" id="downloadBtn">
        <span class="main-text">ЗАВАНТАЖИТИ</span><br>
        <span class="sub-text">для Windows 10/11</span>
      </a>
    </header>

    <section class="gallery">
      <img src="screenshot1.png" alt="Скріншот 1" class="zoomable">
      <img src="screenshot2.png" alt="Скріншот 2" class="zoomable">
    </section>

    <section class="gallery">
  <video class="zoomable video-item" src="video1.mp4" autoplay></video>
  <video class="zoomable video-item" src="video2.mp4" autoplay></video>
  <video class="zoomable video-item" src="video3.mp4" autoplay></video>
</section>

    <footer class="top">
      <p style="font-size: 1em; font-weight: 100;">© 2026 Photostop | Розробник: І.М.Овсієнко</p>
    </footer>
  </div>  
    </div>  
</body>


  <script>

window.addEventListener("scroll", () => {
  let scrollY = window.scrollY;
  // фон рухається повільніше (0.3 = швидкість)
  document.querySelector(".parallax-bg").style.transform = 
    "translateY(" + scrollY * 0.3 + "px)";
});


    document.getElementById("downloadBtn").addEventListener("click", function() {
      alert("Дякуємо за завантаження Photostop!");
    });

    const images = document.querySelectorAll('.zoomable');

    images.forEach(img => {
      img.addEventListener('click', () => {
        const rect = img.getBoundingClientRect();

        const overlay = document.createElement('div');
        overlay.classList.add('overlay');

        const clone = img.cloneNode();
        clone.style.position = 'absolute';
        clone.style.top = rect.top + 'px';
        clone.style.left = rect.left + 'px';
        clone.style.width = rect.width + 'px';
        clone.style.height = rect.height + 'px';
        clone.style.transition = 'all 0.5s ease-in-out';
        clone.style.zIndex = '1000';
        clone.style.borderRadius = '10px';
        clone.style.boxShadow = '0 8px 20px rgba(0,0,0,0.8)';

        overlay.appendChild(clone);
        document.body.appendChild(overlay);

        requestAnimationFrame(() => {
          clone.style.top = '50%';
          clone.style.left = '50%';
          clone.style.transform = 'translate(-50%, -50%)';
          clone.style.width = '70%';
          clone.style.height = '90%';
          clone.style.maxHeight = '90vh';
          clone.style.maxWidth = '90vw';
        });

        overlay.addEventListener('click', () => {
          clone.style.top = rect.top + 'px';
          clone.style.left = rect.left + 'px';
          clone.style.width = rect.width + 'px';
          clone.style.height = rect.height + 'px';
          clone.style.transform = 'translate(0,0)';

          clone.addEventListener('transitionend', () => {
            overlay.remove();
          }, { once: true });
        });
      });
    });

  </script>
</html>
